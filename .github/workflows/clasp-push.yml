name: Push to Apps Script

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'js.html'
      - 'css.html'
      - 'Mã.js'
      - 'logoB64.html'
      - 'appsscript.json'
      - '.clasp.json'
      - '.claspignore'
      - 'scripts/push-apps-script.sh'
      - 'package.json'
      - '.github/workflows/clasp-push.yml'

permissions:
  contents: read

concurrency:
  group: clasp-push-main
  cancel-in-progress: true

jobs:
  clasp-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::Thiếu secret CLASPRC_JSON."
            echo "Thiết lập 1 lần trên máy local:"
            echo "  npx clasp login"
            echo "  gh secret set CLASPRC_JSON < ~/.clasprc.json"
            echo "Hoặc: GitHub → Settings → Secrets → Actions → New secret → CLASPRC_JSON"
            exit 1
          fi
          echo "$CLASPRC_JSON" > ~/.clasprc.json
          chmod 600 ~/.clasprc.json

      - name: Verify clasp auth
        run: npx clasp show-authorized-user

      - name: Push to Apps Script
        run: npm run push:script

      - name: Summary
        run: |
          echo "### Apps Script đã được đẩy" >> "$GITHUB_STEP_SUMMARY"
          echo "- Script ID: \`$(node -p "require('./.clasp.json').scriptId")\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- [Mở trên script.google.com](https://script.google.com/home/projects/$(node -p "require('./.clasp.json').scriptId")/edit)" >> "$GITHUB_STEP_SUMMARY"
